#!/hint/bash
# makepkg configuration for the tools that only the test root needs (sed,
# grep, gawk, diffutils, ...; see crossarm64/ci/build-userland.sh).
#
# The cross configuration of #6922, plus configure tests run natively on this
# ARM64 machine instead of guessed (see crossarm64/config.site).  The ARM64
# runtime, the libraries and sh come from the sysroot's usr/bin at the end of
# PATH, which crossarm64/20-build-userland.sh prepares before each package.
# The recipes of #6922 itself are built with the PR's configuration only.

source "$(cd "$(dirname "${BASH_SOURCE[0]}")/../.ci" && pwd)/makepkg-aarch64-cross.conf"

export CONFIG_SITE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/config.site"
case ":$PATH:" in
  *":/usr/aarch64-pc-cygwin/usr/bin:"*) ;;
  *) export PATH="$PATH:/usr/aarch64-pc-cygwin/usr/bin" ;;
esac
