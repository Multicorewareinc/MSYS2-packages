# makepkg profile for cross-building MSYS2 packages to aarch64-pc-msys.
#
#   makepkg --config /path/to/crossarm64/makepkg-crossarm64.conf -d
#
# --config REPLACES /etc/makepkg.conf, so start from the system file and
# override only what matters.  Nothing here is package-specific.

source /etc/makepkg.conf

# ---------------------------------------------------------------- target ---
CARCH="aarch64"
CHOST="aarch64-pc-msys"

_TARGET="aarch64-pc-msys"
_SYSROOT="/usr/${_TARGET}"

# The real build machine.  NOT ${CHOST}: in this root makepkg.conf sets CHOST
# to the *target*, so passing --build=${CHOST} would make configure believe
# host == build and silently select the native x86_64 gcc.  Derive it from the
# native compiler instead.
_BUILD="$(gcc -dumpmachine)"          # x86_64-pc-cygwin

# ------------------------------------------------------------- toolchain ---
# With --host=aarch64-pc-msys --build=x86_64-pc-cygwin autoconf finds the
# ${host}-prefixed tools by itself, but exporting them removes any doubt and
# covers build systems that do not follow the convention.
export CC="${_TARGET}-gcc"
export CXX="${_TARGET}-g++"
export CPP="${_TARGET}-cpp"
export AR="${_TARGET}-ar"
export AS="${_TARGET}-as"
export LD="${_TARGET}-ld"
export NM="${_TARGET}-nm"
export RANLIB="${_TARGET}-ranlib"
export STRIP="${_TARGET}-strip"
export OBJDUMP="${_TARGET}-objdump"
export DLLTOOL="${_TARGET}-dlltool"
export WINDRES="${_TARGET}-windres"
export RC="${_TARGET}-windres"

# Helpers that must run on the build machine.
export CC_FOR_BUILD=gcc
export CXX_FOR_BUILD=g++
export BUILD_CC=gcc

# pkg-config must look inside the sysroot, never at the host's x86_64 .pc files.
export PKG_CONFIG_LIBDIR="${_SYSROOT}/usr/lib/pkgconfig:${_SYSROOT}/usr/share/pkgconfig"
export PKG_CONFIG_SYSROOT_DIR=""

# ----------------------------------------------------------------- flags ---
CPPFLAGS=""
CFLAGS="-O2 -pipe"
CXXFLAGS="-O2 -pipe"
#
# LDFLAGS must stay empty of -lgcc_eh.  libgcc_eh is a static-only archive, and
# libtool refuses to build a shared library whose dependencies have no shared
# version: it sets droppeddeps=yes and silently degrades the library to
# static-only, after which every consumer fails on undefined __imp_* symbols.
#
# It is not needed anyway: the packaged cross-msysarm64-gcc carries the stock
# conditional spec
#     *libgcc: %{static|static-libgcc:-lgcc -lgcc_eh} %{!static:...-lgcc_s -lgcc}
# unlike the hand-rolled specs file used by the earlier script-based build.
LDFLAGS=""

DEBUG_CFLAGS=""
DEBUG_CXXFLAGS=""

# --------------------------------------------------------------- options ---
#   !strip     makepkg's tidy/strip.sh calls bare `strip`/`objcopy` from PATH -
#              the host x86_64 binutils - and does not honour $STRIP.  Running
#              those over aarch64 PE objects corrupts or errors.
#   !buildflags  packages set their own; the host defaults are x86-specific.
#   staticlibs / libtool  keep .a and .la; the chain links statically.
#   !debug !lto  keep the first bootstrap simple.
OPTIONS=(!strip docs libtool staticlibs emptydirs !zipman purge !debug !lto !buildflags)

#   !check   the test suites run target binaries; enable per package once the
#            basics work.
#   !sign    no signing during bootstrap.
BUILDENV=(!distcc color !ccache !check !sign)

PKGDEST="${PKGDEST:-/c/msys64-mayank/home/mcw/aarch64-pkgs}"
SRCDEST="${SRCDEST:-}"
PKGEXT='.pkg.tar.zst'
