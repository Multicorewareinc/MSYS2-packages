# makepkg profile for cross-building MSYS2 packages to aarch64-pc-msys.
#
#   makepkg --config /path/to/crossarm64/makepkg-crossarm64.conf -d
#
# --config REPLACES /etc/makepkg.conf, so start from the system file and
# override only what matters.  Nothing here is package-specific.

source /etc/makepkg.conf

# ---------------------------------------------------------------- target ---
_TARGET="aarch64-pc-msys"
_SYSROOT="/usr/${_TARGET}"

# The real build machine.  Deliberately NOT taken from this root's
# /etc/makepkg.conf, which sets CHOST to the *target*: passing --build=${CHOST}
# would make configure believe host == build and silently select the native
# x86_64 gcc.  Ask the native compiler instead.
_BUILD="$(gcc -dumpmachine)"          # x86_64-pc-cygwin

# CARCH/CHOST describe the *package*, not the compilation.  These are host-side
# cross packages: they are installed on, and their contents are used by, an
# x86_64 machine - they merely carry aarch64 files under /usr/aarch64-pc-msys.
# Every existing cross-msysarm64-* package is recorded as x86_64, and pacman
# refuses to install one stamped aarch64 on this host ("package architecture is
# not valid").  The recipes take the target from ${_TARGET}/${_BUILD}, never
# from CHOST, so pointing CHOST at the build machine cannot mislead them.
CARCH="x86_64"
CHOST="${_BUILD}"

# ------------------------------------------------------------- toolchain ---
# With --host=aarch64-pc-msys --build=x86_64-pc-cygwin autoconf finds the
# ${host}-prefixed tools by itself, but exporting them removes any doubt and
# covers build systems that do not follow the convention.
export CC="${_TARGET}-gcc"
export CXX="${_TARGET}-g++"
export CPP="${_TARGET}-cpp"
export AR="${_TARGET}-ar"
export AS="${_TARGET}-as"
export LD="${_TARGET}-ld"
export NM="${_TARGET}-nm"
export RANLIB="${_TARGET}-ranlib"
export STRIP="${_TARGET}-strip"
export OBJDUMP="${_TARGET}-objdump"
export DLLTOOL="${_TARGET}-dlltool"
export WINDRES="${_TARGET}-windres"
export RC="${_TARGET}-windres"

# Helpers that must run on the build machine.
export CC_FOR_BUILD=gcc
export CXX_FOR_BUILD=g++
export BUILD_CC=gcc

# pkg-config must look inside the sysroot, never at the host's x86_64 .pc files.
export PKG_CONFIG_LIBDIR="${_SYSROOT}/usr/lib/pkgconfig:${_SYSROOT}/usr/share/pkgconfig"
export PKG_CONFIG_SYSROOT_DIR=""

# ----------------------------------------------------------------- flags ---
#
# NOTE on header shadowing, since it cannot be fixed from here.  The compiler
# searches
#     ${_SYSROOT}/include          <- newlib headers, from -runtime-devel
#     ${_SYSROOT}/usr/include      <- where these packages install
# in that order, so a newlib header shadows a real package's copy of the same
# name.  iconv.h is the case that bites: cross-msysarm64-runtime-devel ships
# newlib's iconv.h at four paths, while native msys2-runtime-devel ships none
# of them - only sys/iconvnls.h.  Because msys-2.0.dll also exports iconv_open,
# a program built against the wrong header still compiles and links; it just
# silently uses the runtime's iconv rather than libiconv, with none of the GNU
# extensions and no _LIBICONV_VERSION.
#
# Adding -I${_SYSROOT}/usr/include does NOT help: gcc drops a -I that names an
# existing system directory, saying so explicitly - "ignoring duplicate
# directory ... as it is a non-system directory that duplicates a system
# directory" - and keeps the original, earlier position.  The fix has to be in
# cross-msysarm64-runtime-devel, which should not be shipping iconv.h at all.
# The specs file vendored beside this profile.  It is byte-identical to the one
# the standalone AArch64 build scripts use, which are already known to work; it
# is kept in the repo rather than referenced from a home directory so the
# recipes are reproducible for anyone else and in CI.
#
# It corrects three things the packaged cross-msysarm64-gcc gets wrong:
#   *link:   -e _msys_dll_entry for shared links.  The stock specs name
#            _cygwin_dll_entry, which nothing in this sysroot defines, so ld
#            only warns and emits DLLs with AddressOfEntryPoint 0 whose
#            initialisation never runs.  This is the central fix for the
#            per-package -Wl,-e workarounds in the older recipes.
#   *libgcc: plain -lgcc, avoiding the shared libgcc that does not exist here.
#   *lib:    the msys library sequence, with --dll-search-prefix=cyg.
#
# Resolved to an absolute path.  It reaches the compiler as -specs=${_SPECS} on
# command lines that run in whatever directory the package's build system has
# chdir'd into, so a path relative to this file - which is what
# ${BASH_SOURCE[0]} gives when makepkg is invoked with --config ../crossarm64/...
# - fails as "cannot read spec file".
_CROSSARM64_DIR="$(cd "$(dirname "${BASH_SOURCE[0]:-.}")" && pwd)"
_SPECS="${_CROSSARM64_DIR}/aarch64-pc-msys.specs"
# Hard-fail rather than falling back to a path outside this checkout.  The old
# fallback named another root's tree, which on a machine that still has that
# root would silently compile against a foreign specs file instead of the one
# vendored here.
[[ -f ${_SPECS} ]] || {
  printf '==> ERROR: specs file not found: %s\n' "${_SPECS}" >&2
  return 1 2>/dev/null || exit 1
}

CPPFLAGS=""
CFLAGS="-O2 -pipe -specs=${_SPECS}"
CXXFLAGS="-O2 -pipe -specs=${_SPECS}"
#
# LDFLAGS must stay empty of -lgcc_eh.  libgcc_eh is a static-only archive, and
# libtool refuses to build a shared library whose dependencies have no shared
# version: it sets droppeddeps=yes and silently degrades the library to
# static-only, after which every consumer fails on undefined __imp_* symbols.
#
# It is not needed anyway: the packaged cross-msysarm64-gcc carries the stock
# conditional spec
#     *libgcc: %{static|static-libgcc:-lgcc -lgcc_eh} %{!static:...-lgcc_s -lgcc}
# unlike the hand-rolled specs file used by the earlier script-based build.
# -Wl,--disable-high-entropy-va is what the tested build scripts pass on every
# link; ASLR with high-entropy VAs breaks the msys fork/exec machinery.
LDFLAGS="-specs=${_SPECS} -Wl,--disable-high-entropy-va"

DEBUG_CFLAGS=""
DEBUG_CXXFLAGS=""

# --------------------------------------------------------------- options ---
#   !strip     makepkg's tidy/strip.sh calls bare `strip`/`objcopy` from PATH -
#              the host x86_64 binutils - and does not honour $STRIP.  Running
#              those over aarch64 PE objects corrupts or errors.
#   !buildflags  packages set their own; the host defaults are x86-specific.
#   staticlibs / libtool  keep .a and .la; the chain links statically.
#   !debug !lto  keep the first bootstrap simple.
OPTIONS=(!strip docs libtool staticlibs emptydirs !zipman purge !debug !lto !buildflags)

#   !check   the test suites run target binaries; enable per package once the
#            basics work.
#   !sign    no signing during bootstrap.
BUILDENV=(!distcc color !ccache !check !sign)

# Relative to this checkout, matching lib.sh.  The previous default named
# another root's tree, so a hand-run `makepkg --config ...` on a fresh machine
# dropped its packages into the old build instead of this one.
PKGDEST="${PKGDEST:-$(cd "${_CROSSARM64_DIR}/.." && pwd)/aarch64-pkgs}"
mkdir -p "${PKGDEST}"
SRCDEST="${SRCDEST:-}"
PKGEXT='.pkg.tar.zst'
